name: Feature request
description: Suggest something the Clipy desktop app or the packages should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Point at the files or functions involved if you know them.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Data and privacy
      description: Would this send anything off the machine? If so, what, and to whom?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to build this myself.
